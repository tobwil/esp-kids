; Pixeluhr · Kinderuhr mit 8-Bit-Wetter-Zifferblatt, Balance, Radio und ARD-Hörspielen – Freigabe durch die Eltern
; Boards: Waveshare ESP32-S3-Touch-AMOLED-1.75C (Standard) und -2.16 (Profil amoled-216), je ESP32-S3R8 mit 8 MB PSRAM
;
;   pio run -t upload                  1.75C kompilieren & per USB-C aufspielen
;   pio run -e amoled-216 -t upload    dasselbe für das 2.16
;   pio device monitor                 Log ansehen

[platformio]
default_envs = amoled-175c

[env:amoled-175c]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L
; Stamm-Zertifikate für HTTPS (tools/make_crt_bundle.sh)
board_build.embed_files =
  x509_crt_bundle

build_flags =
  -Iinclude
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=1
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_CONF_PATH=lv_conf.h

; Automatischer Leichtschlaf: das Arduino-Framework wird dafür mit eigener ESP-IDF-Konfiguration gebaut
; (der erste Build dauert deutlich länger). Der Prozessor schläft zwischen allen Aufgaben, das WLAN bleibt verbunden.
custom_sdkconfig =
  CONFIG_PM_ENABLE=y
  CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
  CONFIG_FREERTOS_IDLE_TIME_BEFORE_SLEEP=3
  CONFIG_PM_PROFILING=y

lib_deps =
  lvgl/lvgl@9.2.2
  moononournation/GFX Library for Arduino@1.6.9
  lewisxhe/SensorLib@0.3.3
  bblanchon/ArduinoJson@7.4.2

; Waveshare ESP32-S3-Touch-AMOLED-2.16 (quadratisch, 480 × 480, sonst fast gleich):  pio run -e amoled-216 -t upload
[env:amoled-216]
extends = env:amoled-175c
build_flags =
  ${env:amoled-175c.build_flags}
  -DBOARD_AMOLED_216
